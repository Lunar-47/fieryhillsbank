<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .message { padding: 10px; background-color: #fff3cd; border: 1px solid #ffeeba; border-radius: 5px; color: #856404; margin-bottom: 15px; }
        input, select, button { padding: 8px; font-size: 16px; margin-bottom: 10px; width: 250px; }

        .btn {
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            border: none;
            text-decoration: none;
            background-color: #602e87;
            color: white;
        }

    </style>
</head>
<body>

    <p class="top-link">
        <a href="{{ url_for('home') }}" style="background-color: #602e87; color: white;" class="btn back-btn">&larr; Back to Dashboard</a>
    </p>

    <h1>Add New Student</h1>

    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}

    <form method="post">
        <input type="text" name="name" placeholder="Full Name" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <select name="grade" required>
            <option value="" disabled selected>Select Grade</option>
            {% for i in range(0, 13) %}
                <option value="{{ i }}">{{ i }}</option>
            {% endfor %}
        </select><br>
        <button type="submit" style = "padding: 10px" class="btn">Add Student</button>
    </form>
</body>
</html>
